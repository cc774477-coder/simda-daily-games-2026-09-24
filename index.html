<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#091322">
  <meta name="description" content="신호 정원, 열핵 배달, 잔상 지도사 웹 게임 프로토타입">
  <title>일일 게임 제작 · 2026.09.24</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b2233'/%3E%3Cpath d='M13 45V19h8l11 15 11-15h8v26h-8V31L32 46 21 31v14z' fill='%2366e6d0'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <script defer src="./game.js"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">SIMDA<span>LAB</span><small>09.24 / THREE PLAYABLE EXPERIMENTS</small></div>
      <nav aria-label="게임 선택">
        <a data-game-link="signal" href="?game=signal">신호 정원</a>
        <a data-game-link="heat" href="?game=heat">열핵 배달</a>
        <a data-game-link="echo" href="?game=echo">잔상 지도사</a>
      </nav>
      <button id="soundButton" class="sound-button" type="button" aria-pressed="false">소리 끔</button>
    </header>

    <main>
      <div class="game-heading">
        <div><p id="modeEyebrow" class="eyebrow"></p><h1 id="modeTitle"></h1><p id="modeIntro" class="intro"></p></div>
        <div class="objective"><span>목표</span><strong>60초 생존</strong><small>자동 공격 + 직접 선택</small></div>
      </div>

      <div class="hud" aria-label="게임 상태">
        <div><span>남은 시간</span><strong id="timeValue">01:00</strong></div>
        <div><span>생명</span><strong id="healthValue">6 / 6</strong></div>
        <div><span>레벨</span><strong id="levelValue">1</strong></div>
        <div><span>처치</span><strong id="killValue">0</strong></div>
      </div>

      <div class="arena-wrap">
        <canvas id="arena" tabindex="0" aria-label="게임 플레이 화면. 방향키나 WASD로 이동, Space로 능력 사용"></canvas>
        <div id="overlay" class="overlay" role="dialog" aria-modal="true">
          <div class="overlay-card">
            <span id="overlayKicker" class="eyebrow"></span>
            <h2 id="overlayTitle"></h2>
            <p id="overlayText"></p>
            <button id="primaryButton" class="primary" type="button">시작하기</button>
            <small id="overlayHint"></small>
          </div>
        </div>
        <div id="upgradePanel" class="upgrade-panel" role="dialog" aria-modal="true" aria-labelledby="upgradeTitle" hidden>
          <div class="upgrade-head"><span class="eyebrow">LEVEL UP</span><h2 id="upgradeTitle">다음 성장을 선택하세요</h2><p>게임은 선택할 때까지 잠시 멈춥니다.</p></div>
          <div id="upgradeChoices" class="upgrade-choices"></div>
        </div>
      </div>

      <div class="underbar">
        <div class="meters"><div class="meter-caption"><span>경험</span><strong id="xpText">0 / 5</strong></div><div class="meter"><i id="xpFill"></i></div><div id="heatMeterBlock" hidden><div class="meter-caption"><span>열</span><strong id="heatText">0%</strong></div><div class="meter heat-meter"><i id="heatFill"></i></div></div></div>
        <div class="ability"><span id="abilityLabel"></span><strong id="abilityValue">준비됨</strong></div>
      </div>

      <div class="instructions"><div><strong>이동</strong><span>WASD · 방향키 · 화면 클릭/터치</span></div><div><strong id="actionLabel">특수 행동</strong><span>Space · 능력 버튼</span></div><div><strong>기타</strong><span>P 일시정지 · 종료 후 R 재시작 · 1~3 성장 선택</span></div></div>
      <div class="touch-controls" aria-label="터치 조작"><div class="dpad"><button data-dir="up" aria-label="위로">▲</button><div><button data-dir="left" aria-label="왼쪽">◀</button><button data-dir="down" aria-label="아래로">▼</button><button data-dir="right" aria-label="오른쪽">▶</button></div></div><button id="touchAction" class="touch-action">능력</button></div>
      <p class="disclaimer">독립 제작 프로토타입 · 기획 점수와 실제 플레이 품질 점수는 별개입니다.</p>
    </main>
  </div>
</body>
</html>
